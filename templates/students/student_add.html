{% extends 'base.html' %}
{% block title %}Add Student - EMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <div>
        <h2 class="mb-1">Add Student</h2>
        <p class="text-muted mb-0">Create a student account and enrollment record.</p>
    </div>
    <a href="{% url 'students:student_list' %}" class="btn btn-outline-secondary">Back to List</a>
</div>

<div class="chart-card p-4">
    <form method="post" action="{% url 'students:student_add' %}">
        {% csrf_token %}
        <div class="row g-3">
            {% if user.is_superuser %}
            <div class="col-12">
                <label class="form-label" for="institutionId">Institution</label>
                <select class="form-select" id="institutionId" name="institution_id" required>
                    <option value="">Select institution</option>
                    {% for institution in institutions %}
                    <option value="{{ institution.id }}">{{ institution.name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="col-md-6">
                <label class="form-label" for="firstName">First Name</label>
                <input class="form-control" id="firstName" name="first_name" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="lastName">Last Name</label>
                <input class="form-control" id="lastName" name="last_name">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" name="email" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="dob">Date of Birth</label>
                <input class="form-control" id="dob" type="date" name="date_of_birth">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="instituteId">Institute ID</label>
                <input class="form-control" id="instituteId" name="institute_id" placeholder="Optional">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="rollNo">Roll No</label>
                <input class="form-control" id="rollNo" name="roll_no" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="className">Class</label>
                <input class="form-control" id="className" name="class_name" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="section">Section</label>
                <input class="form-control" id="section" name="section" required>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="{% url 'students:student_list' %}">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Student</button>
        </div>
    </form>
</div>
{% endblock %}
