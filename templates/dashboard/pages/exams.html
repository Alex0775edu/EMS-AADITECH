{% extends 'base.html' %}
{% block title %}Exams - EMS{% endblock %}
{% block content %}
<div class="chart-card"><h4>Exams</h4><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Date</th><th>Total Marks</th></tr></thead><tbody>{% for exam in exams %}<tr><td>{{ exam.name }}</td><td>{{ exam.date }}</td><td>{{ exam.total_marks }}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted text-center">No exams found</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
