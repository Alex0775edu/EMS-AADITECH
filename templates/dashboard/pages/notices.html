{% extends 'base.html' %}
{% block title %}Notices - EMS{% endblock %}
{% block content %}
<div class="chart-card"><h4>Notices</h4><div class="table-responsive"><table class="table"><thead><tr><th>Title</th><th>Target</th><th>Published</th></tr></thead><tbody>{% for n in notices %}<tr><td>{{ n.title }}</td><td>{{ n.target }}</td><td>{{ n.publish_date }}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted text-center">No notices found</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
