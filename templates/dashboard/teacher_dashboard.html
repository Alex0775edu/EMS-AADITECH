{% extends 'base.html' %}

{% block title %}Teacher Dashboard - EMS Cloud{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h2 class="mb-1">Teacher Dashboard</h2>
        <p class="text-muted mb-0">Manage classes, attendance, assignments and results</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-6 col-lg-3"><a href="{% url 'dashboard:attendance_page' %}" class="dashboard-kpi d-block text-decoration-none"><small class="text-muted">Attendance</small><h5>Mark Attendance</h5></a></div>
    <div class="col-md-6 col-lg-3"><a href="{% url 'dashboard:assignments_page' %}" class="dashboard-kpi d-block text-decoration-none"><small class="text-muted">Assignments</small><h5>Upload Tasks</h5></a></div>
    <div class="col-md-6 col-lg-3"><a href="{% url 'dashboard:exams_page' %}" class="dashboard-kpi d-block text-decoration-none"><small class="text-muted">Exams</small><h5>Exam Planner</h5></a></div>
    <div class="col-md-6 col-lg-3"><a href="{% url 'dashboard:notices_page' %}" class="dashboard-kpi d-block text-decoration-none"><small class="text-muted">Notices</small><h5>Announcements</h5></a></div>
</div>
