<div class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
    <div>
        <strong>We use cookies to improve your experience.</strong>
        <p>
            Cookies help us personalize content, remember preferences, and analyze platform usage.
            Read our <a href="{% url 'privacy' %}">Privacy Policy</a>.
        </p>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-light btn-sm" type="button" data-cookie-accept>Accept</button>
        <button class="btn btn-outline-light btn-sm" type="button" data-cookie-dismiss>Dismiss</button>
    </div>
</div>
